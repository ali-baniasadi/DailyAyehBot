name: Daily Ayeh Bot

on:
  schedule:
    # GitHub delays scheduled runs (often by hours around :00/:30). So we trigger
    # several times EARLY at odd minutes; the "Wait" step holds until TARGET_UTC
    # and only the first run of the day posts (main.py checks last_post_date).
    - cron: "17 1 * * *"
    - cron: "43 2 * * *"
    - cron: "13 3 * * *"
    - cron: "41 3 * * *"

  workflow_dispatch:

concurrency:
  group: daily-post
  cancel-in-progress: false

env:
  TARGET_UTC: "04:30"   # 08:00 Tehran

jobs:
  post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until target time
        if: github.event_name == 'schedule'
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET_UTC" +%s)
          wait=$((target - now))
          if [ "$wait" -gt 0 ] && [ "$wait" -le 14400 ]; then
            echo "Sleeping ${wait}s until $TARGET_UTC UTC"
            sleep "$wait"
          else
            echo "Target time already passed; posting now"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main.py --once

      - name: Commit updated state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json unchanged; nothing to commit."
          else
            git commit -m "chore: update state.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
